[pytest]
# The SIL suite. Unit tests are GoogleTest, run by ctest; this file only
# configures pytest.
testpaths = tests/sil
pythonpath = tools
# Every test marked with the requirement it verifies (Tuesday's trace script
# reads these). Registered here so pytest does not warn about an unknown mark.
markers =
    req(id): the requirement this test verifies
